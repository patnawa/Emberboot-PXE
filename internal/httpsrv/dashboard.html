<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Emberboot</title>
<style>
/* ── Emberboot console: warm iron surfaces, ember accent ─────────────── */
:root{
  --page:#100e0b; --surface:#191612; --raised:#211d17; --hairline:#2d2820;
  --ink:#ece5da; --ink-2:#a89d8d; --ink-3:#6f665a;
  --ember:#e8722a; --ember-soft:rgba(232,114,42,.14);
  --ok:#0ca30c; --warn:#fab219; --bad:#d03b3b;
  --mono:ui-monospace,"Cascadia Mono",Consolas,Menlo,monospace;
  --sans:system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box;margin:0}
html{color-scheme:dark}
body{background:var(--page);color:var(--ink);font:14px/1.5 var(--sans);min-height:100vh}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
:focus-visible{outline:2px solid var(--ember);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{transition:none!important;animation:none!important}}

.app{display:grid;grid-template-columns:210px 1fr;min-height:100vh}
.side{border-right:1px solid var(--hairline);padding:1.1rem .9rem;display:flex;flex-direction:column;gap:1.3rem;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:.55rem;padding:0 .35rem}
.brand b{font-size:1rem}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:.6rem;padding:.44rem .6rem;border-radius:7px;color:var(--ink-2);text-decoration:none;font-weight:500;font-size:.86rem}
.nav a svg{flex:none;opacity:.8}
.nav a:hover{background:var(--surface);color:var(--ink)}
.nav a.on{background:var(--ember-soft);color:var(--ember)}
.side-foot{margin-top:auto;padding:0 .35rem;color:var(--ink-3);font:.72rem var(--mono)}
.main{min-width:0;padding:1.2rem 1.8rem 3rem}
.topbar{display:flex;align-items:center;gap:1rem;padding-bottom:1rem;border-bottom:1px solid var(--hairline);margin-bottom:1.3rem;flex-wrap:wrap}
.topbar h1{font-size:1.1rem;font-weight:600}
.topbar .spacer{flex:1}
.pill{display:inline-flex;align-items:center;gap:.45rem;background:var(--surface);border:1px solid var(--hairline);border-radius:99px;padding:.25rem .8rem;font-size:.78rem;color:var(--ink-2)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.dot.down{background:var(--bad)}
.pill code{font-family:var(--mono);color:var(--ink)}

.eyebrow{font-size:.68rem;font-weight:600;text-transform:uppercase;letter-spacing:.12em;color:var(--ink-3);margin:1.6rem 0 .6rem}
.eyebrow:first-child{margin-top:0}
.panel{background:var(--surface);border:1px solid var(--hairline);border-radius:10px}
.pad{padding:1rem 1.2rem}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:.8rem}
.card{background:var(--surface);border:1px solid var(--hairline);border-radius:10px;padding:.8rem 1rem}
.card .v{font-size:1.5rem;font-weight:650}
.card .k{color:var(--ink-2);font-size:.76rem;margin-top:.1rem}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:.5rem .8rem;border-bottom:1px solid var(--hairline);vertical-align:middle}
th{color:var(--ink-3);font-size:.68rem;text-transform:uppercase;letter-spacing:.1em;font-weight:600}
tr:last-child td{border-bottom:none}
tr.row{cursor:pointer}
tr.row:hover td{background:var(--raised)}
.mono{font-family:var(--mono);font-size:.82rem}
.dim{color:var(--ink-2)}
.faint{color:var(--ink-3)}
.chip{display:inline-flex;align-items:center;gap:.35rem;padding:.06rem .55rem;border-radius:99px;font-size:.72rem;font-weight:600;white-space:nowrap}
.chip.ready,.chip.completed,.chip.pass{background:rgba(12,163,12,.13);color:#4cc44c}
.chip.validating,.chip.active,.chip.stalled,.chip.warn{background:rgba(250,178,25,.12);color:var(--warn)}
.chip.invalid,.chip.failed,.chip.fail{background:rgba(208,59,59,.15);color:#e46a6a}
.chip.plain{background:var(--raised);color:var(--ink-2)}
.empty{padding:2.2rem 1rem;text-align:center;color:var(--ink-2)}
.empty b{color:var(--ink)}
.btn{display:inline-flex;align-items:center;gap:.45rem;background:var(--raised);border:1px solid var(--hairline);border-radius:8px;padding:.45rem .9rem;font-weight:600;font-size:.82rem}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--ember);border-color:var(--ember);color:#180d05}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:#e46a6a}
.btn.danger:hover{border-color:var(--bad)}
.btn.sm{padding:.25rem .6rem;font-size:.74rem}
.rowbtns{display:flex;gap:.35rem;justify-content:flex-end}

/* forms */
.field{margin-bottom:.9rem}
.field label{display:block;font-size:.74rem;font-weight:600;color:var(--ink-2);margin-bottom:.3rem}
.field .hint{font-size:.72rem;color:var(--ink-3);margin-top:.25rem}
input[type=text],input[type=password],input[type=number],select,textarea{
  width:100%;background:var(--page);border:1px solid var(--hairline);border-radius:8px;
  color:var(--ink);padding:.45rem .7rem;font:.84rem var(--mono)}
select{font-family:var(--sans)}
textarea{min-height:12rem;line-height:1.55;resize:vertical}
input[type=checkbox]{accent-color:var(--ember);width:15px;height:15px}
.check{display:flex;align-items:center;gap:.55rem;font-size:.84rem}
.formrow{display:grid;grid-template-columns:1fr 1fr;gap:0 1rem}
.actions{display:flex;gap:.6rem;margin-top:1.1rem;align-items:center}
.tag{font-size:.66rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--warn);border:1px solid var(--warn);border-radius:5px;padding:.05rem .4rem}

/* boot fuse */
.fuse{display:inline-flex;align-items:center}
.fuse i{width:7px;height:7px;border-radius:50%;background:var(--hairline);flex:none}
.fuse i.lit{background:var(--ember)}
.fuse i.end.ok{background:var(--ok)}
.fuse i.end.bad{background:var(--bad)}
.fuse i.end.warn{background:var(--warn)}
.fuse s{width:12px;height:1px;background:var(--hairline);flex:none;text-decoration:none}
.fuse s.lit{background:var(--ember)}

/* chart */
.chartwrap{position:relative;padding:1rem 1.1rem .6rem}
.legend{display:flex;gap:1.1rem;padding:.2rem 1.1rem .8rem;font-size:.76rem;color:var(--ink-2)}
.legend b{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:.4rem}
.tip{position:absolute;pointer-events:none;background:var(--raised);border:1px solid var(--hairline);border-radius:8px;padding:.5rem .7rem;font-size:.76rem;display:none;z-index:5;box-shadow:0 6px 20px rgba(0,0,0,.45);min-width:9rem}
.tip .h{color:var(--ink-3);font-family:var(--mono);margin-bottom:.25rem}
.tip .r{display:flex;justify-content:space-between;gap:1rem}
.tip .r b{font-weight:400}

.toolbar{display:flex;gap:.6rem;align-items:center;margin-bottom:.9rem;flex-wrap:wrap}
.search{background:var(--surface);border:1px solid var(--hairline);border-radius:8px;color:var(--ink);padding:.45rem .8rem;font:.82rem var(--mono);width:16rem}
.search::placeholder{color:var(--ink-3);font-family:var(--sans)}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--hairline);border-radius:8px;overflow:hidden}
.seg button{padding:.4rem .8rem;font-size:.78rem;font-weight:600;color:var(--ink-2)}
.seg button.on{background:var(--ember-soft);color:var(--ember)}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(8,6,4,.6);opacity:0;pointer-events:none;transition:opacity .16s;z-index:20}
.scrim.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(500px,96vw);background:var(--surface);border-left:1px solid var(--hairline);transform:translateX(102%);transition:transform .16s ease-out;z-index:21;display:flex;flex-direction:column}
.drawer.open{transform:none}
.drawer-h{display:flex;align-items:center;gap:.8rem;padding:1rem 1.2rem;border-bottom:1px solid var(--hairline)}
.drawer-h h2{font-size:.95rem;min-width:0;overflow-wrap:anywhere}
.drawer-h button{margin-left:auto;color:var(--ink-2);font-size:1.1rem;padding:.2rem .5rem}
.drawer-b{overflow-y:auto;padding:1rem 1.2rem 2rem}
.kv{display:grid;grid-template-columns:8.5rem 1fr;gap:.35rem .8rem;font-size:.82rem;margin-bottom:1rem}
.kv dt{color:var(--ink-3)}
.kv dd{overflow-wrap:anywhere}
pre.code{background:var(--page);border:1px solid var(--hairline);border-radius:8px;padding:.7rem .9rem;font:.78rem/1.55 var(--mono);overflow-x:auto;white-space:pre}
.tl{border-left:2px solid var(--hairline);margin:.4rem 0 0 .4rem;padding-left:1.1rem;display:flex;flex-direction:column;gap:.75rem}
.tl .e{position:relative}
.tl .e::before{content:"";position:absolute;left:calc(-1.1rem - 6px);top:.35rem;width:8px;height:8px;border-radius:50%;background:var(--ember)}
.tl .e.term-ok::before{background:var(--ok)}
.tl .e.term-bad::before{background:var(--bad)}
.tl .meta{font:.72rem var(--mono);color:var(--ink-3)}
.tl .stage{font-weight:600;font-size:.78rem;color:var(--ink-2);text-transform:uppercase;letter-spacing:.06em;margin-right:.5rem}
.hintbox{background:rgba(250,178,25,.08);border:1px solid rgba(250,178,25,.4);border-radius:8px;padding:.7rem .9rem;font-size:.8rem;margin-bottom:1rem}
.hintbox b{color:var(--warn)}

/* diagnostics */
.checks .c{display:flex;gap:.8rem;padding:.55rem .9rem;border-bottom:1px solid var(--hairline);align-items:baseline}
.checks .c:last-child{border-bottom:none}
.checks .name{min-width:11rem;font-weight:600;font-size:.84rem}
.checks .detail{color:var(--ink-2);font-size:.8rem}
.loglines{font:.76rem/1.6 var(--mono);padding:.6rem .9rem;max-height:24rem;overflow-y:auto;white-space:pre-wrap;overflow-wrap:anywhere}
.loglines .WARN{color:var(--warn)}
.loglines .ERROR{color:#e46a6a}
.loglines .DEBUG{color:var(--ink-3)}
.loglines .t{color:var(--ink-3)}

.toast{position:fixed;bottom:1.2rem;right:1.2rem;background:var(--raised);border:1px solid var(--hairline);border-left:3px solid var(--ok);border-radius:8px;padding:.7rem 1rem;font-size:.82rem;z-index:30;display:none;max-width:28rem;overflow-wrap:anywhere}
.toast.err{border-left-color:var(--bad)}
.banner{display:none;background:rgba(208,59,59,.1);border:1px solid var(--bad);border-radius:10px;padding:.8rem 1rem;margin-bottom:1.2rem}
.banner b{color:#e46a6a}
.banner pre{margin-top:.4rem;font:.76rem/1.5 var(--mono);white-space:pre-wrap;color:var(--ink-2)}

@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{position:static;height:auto;flex-direction:row;align-items:center;border-right:none;border-bottom:1px solid var(--hairline);flex-wrap:wrap}
  .nav{flex-direction:row;flex-wrap:wrap}
  .side-foot{display:none}
  .main{padding:1rem}
  .formrow{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M12 2c1 4-4 5.5-4 10a4 4 0 0 0 8 0c0-2-1-3.2-1.6-4.4C16.5 8.6 19 10.8 19 14a7 7 0 1 1-14 0C5 8 11 6.5 12 2z" fill="#e8722a"/>
        <path d="M12 12c.5 1.8-1.6 2.3-1.6 4.2a1.9 1.9 0 1 0 3.8 0c0-1.9-1.7-2.4-2.2-4.2z" fill="#100e0b" opacity=".55"/>
      </svg>
      <b>Emberboot</b>
    </div>
    <nav class="nav" aria-label="Sections">
      <a href="#overview" data-view="overview"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="1.5" y="1.5" width="5.4" height="5.4" rx="1"/><rect x="9.1" y="1.5" width="5.4" height="5.4" rx="1"/><rect x="1.5" y="9.1" width="5.4" height="5.4" rx="1"/><rect x="9.1" y="9.1" width="5.4" height="5.4" rx="1"/></svg>Overview</a>
      <a href="#images" data-view="images"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="6.2"/><circle cx="8" cy="8" r="1.6"/></svg>Images</a>
      <a href="#sessions" data-view="sessions"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M1.5 8h3l2-4.5 3 9 2-4.5h3"/></svg>Boot sessions</a>
      <a href="#targeting" data-view="targeting"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="5.5"/><path d="M8 1v3M8 12v3M1 8h3M12 8h3"/></svg>Targeting</a>
      <a href="#answers" data-view="answers"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 1.5h5.5L13 5v9.5H4z"/><path d="M9.5 1.5V5H13M6 8.5h4M6 11h4"/></svg>Answer files</a>
      <a href="#alerts" data-view="alerts"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 2a4 4 0 0 1 4 4c0 3 1 4 1.5 4.5h-11C3 10 4 9 4 6a4 4 0 0 1 4-4z"/><path d="M6.6 13a1.5 1.5 0 0 0 2.8 0"/></svg>Alerts</a>
      <a href="#diagnostics" data-view="diagnostics"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M1.5 9h3l1.5-5 3 8 1.5-3h4"/></svg>Diagnostics</a>
      <a href="#config" data-view="config"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 4.5h8M12.5 4.5H14M2 11.5h3M7.5 11.5H14"/><circle cx="10.5" cy="4.5" r="1.8"/><circle cx="5.5" cy="11.5" r="1.8"/></svg>Config</a>
    </nav>
    <div class="side-foot" id="foot">–</div>
  </aside>

  <main class="main">
    <div class="topbar">
      <h1 id="view-title">Overview</h1>
      <span class="spacer"></span>
      <span class="pill"><span class="dot" id="live-dot"></span><span id="live-text">connecting…</span></span>
      <span class="pill">site <code id="site">–</code></span>
      <span class="pill">up <code id="uptime">–</code></span>
    </div>
    <div class="banner" id="cfg-banner">
      <b>Config file rejected — still serving the last good configuration.</b>
      <pre id="cfg-error"></pre>
    </div>
    <div id="view"></div>
  </main>
</div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title">
  <div class="drawer-h"><h2 id="drawer-title"></h2><button id="drawer-x" aria-label="Close">✕</button></div>
  <div class="drawer-b" id="drawer-body"></div>
</aside>
<div class="toast" id="toast"></div>

<script>
"use strict";
/* ── helpers ────────────────────────────────────────────────────────── */
const $=s=>document.querySelector(s);
const $$=s=>[...document.querySelectorAll(s)];
const esc=v=>String(v??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmtSize=b=>b>=1e9?(b/1e9).toFixed(1)+" GB":b>=1e6?(b/1e6).toFixed(0)+" MB":Math.round((b||0)/1e3)+" kB";
const fmtT=s=>new Date(s).toLocaleString([], {month:"short",day:"numeric",hour:"2-digit",minute:"2-digit"});
const fmtClock=s=>new Date(s).toLocaleTimeString([], {hour12:false});
const fmtUp=s=>s>=86400?`${Math.floor(s/86400)}d ${Math.floor(s%86400/3600)}h`:s>=3600?`${Math.floor(s/3600)}h ${Math.floor(s%3600/60)}m`:`${Math.floor(s/60)}m ${s%60}s`;
async function j(u,opt){
  const r=await fetch(u,opt);
  if(!r.ok){
    let msg=`${r.status}`;
    try{const b=await r.json();if(b.error)msg=b.error}catch(_){/* not json */}
    throw new Error(msg);
  }
  return r.headers.get("content-type")?.includes("json")?r.json():r.text();
}
const api={
  patch:ops=>j("/api/config",{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({ops})}),
  post:(u,body)=>j(u,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body||{})}),
  put:(u,body)=>j(u,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)}),
  putText:(u,text)=>j(u,{method:"PUT",body:text}),
  del:u=>j(u,{method:"DELETE"}),
};
function toast(msg,err){const t=$("#toast");t.textContent=msg;t.className="toast"+(err?" err":"");t.style.display="block";clearTimeout(t._h);t._h=setTimeout(()=>t.style.display="none",err?7000:3500)}
function copy(text,label){navigator.clipboard?.writeText(text).then(()=>toast(label+" copied"),()=>toast("Copy failed — select the text manually",true))}

/* ── state ──────────────────────────────────────────────────────────── */
const S={view:"overview",health:null,images:[],sessions:[],alerts:[],activity:[],config:null,
        cfgFull:null,answers:[],q:"",filter:"all",connected:false};
/* Views that hold form state are never auto re-rendered — a poll must not
   eat an admin's unsaved edits. */
const LIVE_VIEWS=new Set(["overview","images","sessions","alerts"]);

async function refresh(){
  try{
    const [h,imgs,sess,al,act,cfg,full,ans]=await Promise.all([
      j("/api/health"),j("/api/images"),j("/api/sessions?limit=200"),
      j("/api/alerts"),j("/api/activity?hours=24"),j("/api/config"),
      j("/api/config/full"),j("/api/answers")]);
    Object.assign(S,{health:h,images:imgs,sessions:sess,alerts:al,activity:act,config:cfg,cfgFull:full,answers:ans,connected:true});
  }catch(e){S.connected=false}
  paintChrome();
  // First successful load repaints whatever view is open (it rendered empty
  // before data existed); after that, only live views auto-refresh so form
  // edits are never eaten by a poll.
  const firstData=S.connected&&!S.painted;
  if(firstData)S.painted=true;
  if((firstData||LIVE_VIEWS.has(S.view))&&!$("#drawer").classList.contains("open"))render();
}
function paintChrome(){
  const h=S.health;
  $("#live-dot").className="dot"+(S.connected?"":" down");
  $("#live-text").textContent=S.connected?"live":"connection lost — retrying";
  if(h){$("#site").textContent=h.site;$("#uptime").textContent=fmtUp(h.uptime_seconds);
        $("#foot").textContent=`emberbootd ${h.version}`}
  const b=$("#cfg-banner");
  if(S.config?.rejected){b.style.display="block";$("#cfg-error").textContent=S.config.rejected}
  else b.style.display="none";
}
setInterval(()=>{if(!document.hidden)refresh()},5000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)refresh()});

/* ── router ─────────────────────────────────────────────────────────── */
const TITLES={overview:"Overview",images:"Images",sessions:"Boot sessions",targeting:"Targeting",
              answers:"Answer files",alerts:"Alerts",diagnostics:"Diagnostics",config:"Config"};
function route(){
  const v=(location.hash||"#overview").slice(1);
  S.view=TITLES[v]?v:"overview";
  $$(".nav a").forEach(a=>a.classList.toggle("on",a.dataset.view===S.view));
  $("#view-title").textContent=TITLES[S.view];
  stopLogFollow();
  render();
}
window.addEventListener("hashchange",route);

const views={};
function render(){(views[S.view]||views.overview)()}

/* ── boot fuse ──────────────────────────────────────────────────────── */
const STAGES=["dhcp","tftp","script","payload"];
function fuse(sess){
  const seen=new Set(sess.stages||[]);
  let html='<span class="fuse" title="dhcp → tftp → menu → payload">';
  STAGES.forEach((st,i)=>{
    const lit=seen.has(st);
    if(i>0)html+=`<s class="${lit?"lit":""}"></s>`;
    html+=`<i class="${lit?"lit":""}"></i>`;
  });
  const cls=sess.result==="completed"?"end ok":sess.result?"end "+(sess.result==="stalled"?"warn":"bad"):"";
  html+=`<s class="${sess.result?"lit":""}"></s><i class="${cls}"></i></span>`;
  return html;
}
function resultChip(r){return r?`<span class="chip ${esc(r)}">${r==="completed"?"✓ ":r==="stalled"?"⚠ ":"✕ "}${esc(r)}</span>`
                              :'<span class="chip active">● in progress</span>'}

/* ── overview ───────────────────────────────────────────────────────── */
views.overview=function(){
  const h=S.health||{},ready=S.images.filter(i=>i.state==="ready").length;
  const day=Date.now()-864e5,al24=S.alerts.filter(a=>+new Date(a.time)>day).length;
  $("#view").innerHTML=`
    <div class="cards">
      <div class="card"><div class="v">${S.connected?"Serving":"Down"}</div><div class="k">Boot service</div></div>
      <div class="card"><div class="v">${ready}<span class="faint"> / ${S.images.length}</span></div><div class="k">Images ready</div></div>
      <div class="card"><div class="v">${h.active_sessions??"–"}</div><div class="k">Machines booting now</div></div>
      <div class="card"><div class="v">${al24}</div><div class="k">Alerts, last 24 h</div></div>
    </div>
    <div class="eyebrow">Boot activity — last 24 hours</div>
    <div class="panel">
      <div class="chartwrap" id="chart"></div>
      <div class="legend">
        <span><b style="background:var(--ok)"></b>✓ Completed</span>
        <span><b style="background:var(--warn)"></b>⚠ Stalled</span>

/* Failure hints: keyed by the last pipeline stage that was reached. */
const HINTS={
  dhcp:"The machine got the PXE answer but never fetched the bootloader. Usually the client's VLAN cannot reach UDP 69 (TFTP) on this server — check firewalls and IP helpers, or verify DHCP options 66/67 in options66-67 mode.",
  tftp:"The bootloader was delivered but the boot menu was never fetched. The boot HTTP port is probably blocked from that client's VLAN — check firewalls between the VLAN and this server.",
  script:"The menu was delivered but no payload transfer started. Either nobody picked an entry before the machine was turned off, or the chosen image failed to start — check the image's state under Images.",
  payload:"The payload transfer started but never finished. Usually a network interruption, the client running out of RAM for a RAM-loaded image, or the machine being powered off mid-install.",
};
function lastStage(evs){let last="";for(const e of evs||[])if(STAGES.includes(e.stage))last=e.stage;return last}

async function sessionDrawer(id){
  let s;try{s=await j("/api/sessions/"+id)}catch(e){toast("Could not load session "+id,true);return}
  const evs=s.events||[];
  const t0=evs.length?+new Date(evs[0].at):0;
  const failed=s.result==="failed"||s.result==="stalled";
  const hint=failed?HINTS[lastStage(evs)]:"";
  openDrawer(`${s.mac}`,`
    <dl class="kv">
      <dt>Result</dt><dd>${resultChip(s.result)}</dd>
      <dt>Started</dt><dd>${fmtT(s.started_at)}</dd>
      <dt>IP</dt><dd class="mono">${esc(s.ip||"–")}</dd>
      <dt>Firmware</dt><dd class="mono">${esc(s.firmware||"–")}</dd>
      <dt>Image</dt><dd class="mono">${esc(s.image||"–")}</dd>
      <dt>Strategy</dt><dd class="mono">${esc(s.strategy||"–")}</dd>
    </dl>
    ${hint?`<div class="hintbox"><b>Likely cause:</b> ${esc(hint)}</div>`:""}
    <div class="eyebrow" style="margin-top:0">Timeline</div>
    <div class="tl">${evs.map(e=>{
      const dt=((+new Date(e.at)-t0)/1000);
      const term=e.stage==="complete"?"term-ok":e.stage==="fail"?"term-bad":"";
      return `<div class="e ${term}"><span class="stage">${esc(e.stage)}</span>${esc(e.detail)}
        <div class="meta">${fmtClock(e.at)} · +${dt<60?dt.toFixed(1)+"s":Math.floor(dt/60)+"m "+Math.round(dt%60)+"s"}</div></div>`;
    }).join("")||'<div class="dim">No events recorded for this session.</div>'}</div>`);
}

function overrideDrawer(ovs,idx){
  const o=idx>=0?ovs[idx]:{name:"",mac:"",subnet:"",deny:false,menu:null,answer_file:""};
  const imgChecks=S.images.map(i=>`<label class="check" style="margin:.2rem 0">
    <input type="checkbox" class="ov-menu" value="${esc(i.file_name)}" ${o.menu?.includes(i.file_name)?"checked":""}>
    <span class="mono" style="font-size:.78rem">${esc(i.file_name)}</span></label>`).join("");
  const ansOpts=['<option value="">none</option>',
    ...S.answers.map(a=>`<option ${a.name===o.answer_file?"selected":""}>${esc(a.name)}</option>`)].join("");
  openDrawer(idx>=0?"Edit rule":"Add rule",`
    <div class="field"><label for="ov-name">Rule name</label><input type="text" id="ov-name" value="${esc(o.name)}" placeholder="lab-vlan"></div>
    <div class="formrow">

        <div class="hint">* matches the rest, ? one digit. Leave empty to match by subnet only.</div></div>
      <div class="field"><label for="ov-subnet">Subnet (CIDR)</label><input type="text" id="ov-subnet" value="${esc(o.subnet||"")}" placeholder="10.1.2.0/24"></div>
    </div>
    <label class="check" style="margin-bottom:1rem"><input type="checkbox" id="ov-deny" ${o.deny?"checked":""}> Deny boot service to matching machines</label>
    <div class="field" id="ov-menu-wrap"><label>Limit the boot menu to these images <span class="faint">(none checked = full menu)</span></label>
      ${imgChecks||'<div class="hint">No images yet.</div>'}</div>
    <div class="field"><label for="ov-ans">Answer file for matching machines</label><select id="ov-ans">${ansOpts}</select></div>
    <div class="actions">
      <button class="btn primary" id="ov-save">${idx>=0?"Save rule":"Add rule"}</button>
    </div>`);
  $("#ov-save").addEventListener("click",()=>{
    const n={name:$("#ov-name").value.trim()};
    const mac=$("#ov-mac").value.trim(),sub=$("#ov-subnet").value.trim();
    if(mac)n.mac=mac;if(sub)n.subnet=sub;
    if($("#ov-deny").checked)n.deny=true;

    if(idx>=0)ovs[idx]=n;else ovs.push(n);
    closeDrawer();
    saveOverrides(ovs,idx>=0?"Rule saved":"Rule added");
  });
}

        <div class="field"><label for="c-timeout">Menu timeout (seconds before booting from local disk)</label>
          <input type="number" id="c-timeout" min="5" max="600" value="${menu.timeout_seconds||30}"></div>
      </div>
      <label class="check" style="margin-bottom:.9rem"><input type="checkbox" id="c-lockdown" ${sec.allow_unknown_macs===false?"checked":""}>
        Lockdown — machines matching no Targeting rule get no boot service</label>
      <div class="field"><label for="c-webhook">Alert webhook URL <span class="faint">(receives JSON for every alert; empty = log only)</span></label>
        <input type="text" id="c-webhook" value="${esc(al.webhook_url||"")}" placeholder="https://…"></div>
      <div class="formrow">
        <div class="field"><label for="c-spikepc">Failure-spike threshold (%)</label><input type="number" id="c-spikepc" min="1" max="100" value="${spike.threshold_percent||20}"></div>
        <div class="field"><label for="c-spikemin">…but only after this many boots in the window</label><input type="number" id="c-spikemin" min="1" value="${spike.min_sessions||10}"></div>
      </div>
      <div class="actions"><button class="btn primary" id="c-save">Save settings</button></div>
    </div>

    <div class="eyebrow">Sign-in &amp; API access</div>
    <div class="panel pad">
      <dl class="kv" style="margin-bottom:.6rem">
        <dt>Console sign-in</dt><dd>${full.has_password?'<span class="chip ready">✓ password set (user: admin)</span>':'<span class="chip stalled">⚠ open access</span>'}</dd>
        <dt>API tokens</dt><dd id="tok-count">${full.token_count||0} active</dd>
      </dl>
      <div class="formrow">
        <div class="field"><label for="pw1">${full.has_password?"Change password":"Set a password"}</label><input type="password" id="pw1" autocomplete="new-password"></div>
        <div class="field"><label for="pw2">Repeat password</label><input type="password" id="pw2" autocomplete="new-password"></div>
      </div>
      <div class="actions" style="margin-top:0;margin-bottom:1.1rem">
        <button class="btn primary" id="pw-save">Save password</button>
      </div>
      <div id="tok-list" class="dim" style="font-size:.8rem;margin-bottom:.6rem">Loading tokens…</div>
      <button class="btn" id="tok-new">Create API token</button>
    </div>

    <div class="eyebrow">Network <span class="tag">applies after restart</span></div>
    <div class="panel pad">
      <div class="formrow">
        <div class="field"><label for="n-mode">DHCP mode</label>
          <select id="n-mode">
            <option value="proxy" ${net.dhcp_mode!=="options66-67"?"selected":""}>proxy — coexist with the existing DHCP server</option>
            <option value="options66-67" ${net.dhcp_mode==="options66-67"?"selected":""}>options66-67 — the DHCP server points clients here</option>
          </select></div>
        <div class="field"><label for="n-adv">Advertise IP <span class="faint">(empty = autodetect)</span></label>
          <input type="text" id="n-adv" value="${esc(net.advertise_ip||"")}" placeholder="${esc(h.advertise_ip||"")}"></div>
      </div>
      <div class="actions" style="margin-top:0;margin-bottom:.9rem"><button class="btn" id="n-save">Save network settings</button></div>
      <p class="dim" style="font-size:.82rem;margin-bottom:.5rem">For DHCP servers on relayed VLANs (or options66-67 mode), configure:</p>
      <pre class="code">Option 66 (TFTP server) : ${esc(h.advertise_ip||"")}
Option 67 (boot file)   : undionly.kpxe   ← BIOS clients
                          snponly.efi     ← UEFI x64 clients</pre>
      <div class="actions"><button class="btn" id="copy-dhcp">Copy DHCP values</button></div>
    </div>`;
  $("#reload").addEventListener("click",async()=>{
    try{const r=await api.post("/api/reload");
      r.ok?toast("Config reloaded"):toast("Config rejected — still serving last good. "+r.error,true);refresh()}
    catch(e){toast("Reload failed: "+e.message,true)}
  });
  $("#raw-edit").addEventListener("click",rawEditorDrawer);
  $("#c-save").addEventListener("click",async()=>{
    const ops=[
      {path:["menu","title"],value:$("#c-title").value.trim()||"Emberboot Network Boot"},
      {path:["menu","timeout_seconds"],value:+$("#c-timeout").value||30},
      {path:["security","allow_unknown_macs"],value:!$("#c-lockdown").checked},
      {path:["alerts","failure_spike","threshold_percent"],value:+$("#c-spikepc").value||20},
      {path:["alerts","failure_spike","min_sessions"],value:+$("#c-spikemin").value||10},
    ];
    const wh=$("#c-webhook").value.trim();
    ops.push(wh?{path:["alerts","webhook_url"],value:wh}:{path:["alerts","webhook_url"],delete:true});
    try{await api.patch(ops);toast("Settings saved");await refresh();render()}
    catch(e){toast("Not saved — "+e.message,true)}
  });
  $("#pw-save").addEventListener("click",async()=>{
    const a=$("#pw1").value,b=$("#pw2").value;
    if(a!==b){toast("Passwords do not match",true);return}
    try{await api.post("/api/auth/password",{password:a});
      toast("Password saved — the browser will ask you to sign in as admin");await refresh();render()}
    catch(e){toast("Not saved — "+e.message,true)}
  });
  $("#n-save").addEventListener("click",async()=>{
    const ops=[{path:["network","dhcp_mode"],value:$("#n-mode").value}];
    const adv=$("#n-adv").value.trim();
    ops.push(adv?{path:["network","advertise_ip"],value:adv}:{path:["network","advertise_ip"],delete:true});
    try{await api.patch(ops);toast("Network settings saved — restart the service to apply")}
    catch(e){toast("Not saved — "+e.message,true)}
  });
  $("#copy-dhcp").addEventListener("click",()=>copy(`option 66 = ${h.advertise_ip}\noption 67 = undionly.kpxe (BIOS) / snponly.efi (UEFI x64)`,"DHCP values"));
  loadTokens();
  $("#tok-new").addEventListener("click",async()=>{
    try{const r=await api.post("/api/auth/tokens");
      openDrawer("API token created",`
        <p class="dim" style="font-size:.84rem;margin-bottom:.8rem">Copy it now — this is the only time the full token is shown. Use it as <span class="mono">Authorization: Bearer …</span></p>
        <pre class="code">${esc(r.token)}</pre>
        <div class="actions"><button class="btn primary" id="tok-copy">Copy token</button></div>`);
      $("#tok-copy").addEventListener("click",()=>copy(r.token,"Token"));
      loadTokens();refresh();}
    catch(e){toast("Could not create token — "+e.message,true)}
  });
};
async function loadTokens(){
  const el=$("#tok-list");if(!el)return;
  try{
    const toks=await j("/api/auth/tokens");
    el.innerHTML=toks.length?toks.map(t=>`<div style="display:flex;gap:.8rem;align-items:center;padding:.2rem 0">
      <span class="mono">${esc(t.hint)}</span>
      <button class="btn sm danger" data-tokdel="${t.index}">Revoke</button></div>`).join("")
      :"No API tokens yet.";
    $$("[data-tokdel]").forEach(b=>b.addEventListener("click",async()=>{
      if(!confirm("Revoke this token? Anything using it loses access immediately."))return;
      try{await api.del("/api/auth/tokens/"+b.dataset.tokdel);toast("Token revoked");loadTokens();refresh()}
      catch(e){toast("Revoke failed — "+e.message,true)}
    }));
  }catch(e){el.textContent="Could not load tokens."}
}
async function rawEditorDrawer(){
  let raw;try{raw=await j("/api/config/raw")}catch(e){toast("Could not load the file — "+e.message,true);return}
  openDrawer("emberboot.yaml",`
    <p class="dim" style="font-size:.8rem;margin-bottom:.6rem">The whole configuration, as it is on disk. Saving validates first — an invalid save changes nothing.</p>
    <div class="field"><textarea id="raw-yaml" spellcheck="false" style="min-height:22rem">${esc(raw)}</textarea></div>
    <div class="actions"><button class="btn primary" id="raw-save">Validate and save</button></div>
    <pre class="code" id="raw-err" style="display:none;border-color:var(--bad)"></pre>`);
  $("#raw-save").addEventListener("click",async()=>{
    try{await api.put("/api/config/raw",{yaml:$("#raw-yaml").value});
      toast("Config saved and reloaded");closeDrawer();refresh()}
    catch(e){const el=$("#raw-err");el.style.display="block";el.textContent=e.message;toast("Rejected — nothing changed",true)}
  });
}

/* ── drawer ─────────────────────────────────────────────────────────── */
let lastFocus=null;
function openDrawer(title,html){
  lastFocus=document.activeElement;
  $("#drawer-title").textContent=title;
  $("#drawer-body").innerHTML=html;
  $("#drawer").classList.add("open");$("#scrim").classList.add("open");
  $("#drawer-x").focus();
}
function closeDrawer(){
  $("#drawer").classList.remove("open");$("#scrim").classList.remove("open");
  lastFocus?.focus?.();
}
$("#drawer-x").addEventListener("click",closeDrawer);
$("#scrim").addEventListener("click",closeDrawer);
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeDrawer()});

/* ── activity chart ─────────────────────────────────────────────────── */
function drawChart(host,buckets){
  if(!host)return;
  const total=buckets.reduce((a,b)=>a+b.completed+b.failed+b.stalled,0);
  if(!total){host.innerHTML=`<div class="empty" style="padding:1.6rem"><b>No boots in the last 24 hours.</b><br>Hourly results land here as machines start booting.</div>`;return}
  const W=host.clientWidth-20||600,H=150,padL=30,padB=18;
  const n=buckets.length,slot=(W-padL)/n,bw=Math.max(4,Math.min(18,Math.floor(slot)-2));
  const max=Math.max(...buckets.map(b=>b.completed+b.failed+b.stalled));
  const yMax=Math.max(2,Math.ceil(max/2)*2);
  const y=v=>H-padB-(v/yMax)*(H-padB-8);
  // Status palette (validated on this surface); SVG presentation attributes
  // cannot resolve CSS var(), so literal hexes are used.
  const C={completed:"#0ca30c",stalled:"#fab219",failed:"#d03b3b"};
  let svg=`<svg width="${W}" height="${H}" role="img" aria-label="Boots per hour by result, last 24 hours">`;
  [0,yMax/2,yMax].forEach(v=>{svg+=`<line x1="${padL}" x2="${W}" y1="${y(v)}" y2="${y(v)}" style="stroke:var(--hairline)" stroke-width="1"/>
    <text x="${padL-6}" y="${y(v)+3}" text-anchor="end" font-size="9" style="fill:var(--ink-3);font-family:var(--mono);font-variant-numeric:tabular-nums">${v}</text>`});
  buckets.forEach((b,i)=>{
    const x=padL+i*slot+(slot-bw)/2;let cur=0;
    const parts=[["completed",b.completed],["stalled",b.stalled],["failed",b.failed]].filter(p=>p[1]>0);
    parts.forEach(([k,v],pi)=>{
      const y1=y(cur+v),h=Math.max(1,y(cur)-y(cur+v)-(pi<parts.length-1?2:0));
      svg+=`<rect x="${x}" y="${y1}" width="${bw}" height="${h}" fill="${C[k]}" ${pi===parts.length-1?'rx="2"':""}/>`;
      cur+=v;
    });
    const hr=new Date(b.hour).getHours();
    if(hr%4===0)svg+=`<text x="${x+bw/2}" y="${H-4}" text-anchor="middle" font-size="9" style="fill:var(--ink-3);font-family:var(--mono)">${String(hr).padStart(2,"0")}:00</text>`;
    svg+=`<rect x="${padL+i*slot}" y="0" width="${slot}" height="${H-padB}" fill="transparent" data-b="${i}"/>`;
  });
  svg+="</svg>";
  host.innerHTML=svg+`<div class="tip" id="tip"></div>`;
  const tip=$("#tip");
  host.querySelectorAll("[data-b]").forEach(r=>{
    r.addEventListener("mouseenter",()=>{
      const b=buckets[+r.dataset.b],hr=new Date(b.hour);
      tip.innerHTML=`<div class="h">${String(hr.getHours()).padStart(2,"0")}:00–${String((hr.getHours()+1)%24).padStart(2,"0")}:00</div>
        <div class="r"><span><b style="color:#0ca30c">✓</b> Completed</span><b>${b.completed}</b></div>
        <div class="r"><span><b style="color:#fab219">⚠</b> Stalled</span><b>${b.stalled}</b></div>
        <div class="r"><span><b style="color:#d03b3b">✕</b> Failed</span><b>${b.failed}</b></div>`;
      tip.style.display="block";
      tip.style.left=Math.min(+r.getAttribute("x")+10,host.clientWidth-170)+"px";
      tip.style.top="6px";
    });
    r.addEventListener("mouseleave",()=>tip.style.display="none");
  });
}
let resizeT;window.addEventListener("resize",()=>{clearTimeout(resizeT);resizeT=setTimeout(()=>{if(S.view==="overview")render()},150)});

/* ── go ─────────────────────────────────────────────────────────────── */
route();refresh();
</script>
</body>
</html>
